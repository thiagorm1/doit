version: '3.8'

services:
  db:
    image: postgres:16
    container_name: doit-postgres
    environment:
      POSTGRES_USER: doit_user
      POSTGRES_PASSWORD: doit_password
      POSTGRES_DB: doit_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    image: maven:3.9.6-eclipse-temurin-21-alpine
    container_name: doit-backend-dev
    working_dir: /app
    volumes:
      - ./backend:/app
      - maven-repo:/root/.m2
    command: mvn spring-boot:run
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/doit_db
      - SPRING_DATASOURCE_USERNAME=doit_user
      - SPRING_DATASOURCE_PASSWORD=doit_password
    ports:
      - "8080:8080"
    depends_on:
      - db
    restart: unless-stopped

  web:
    image: node:20-alpine
    container_name: doit-frontend-dev
    working_dir: /app
    volumes:
      - ./frontend:/app
    # Instala os pacotes se não existirem e roda o servidor de dev (Vite com hot-reload)
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
      - "5174:5174"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  maven-repo:
