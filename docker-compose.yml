version: '3.8'

services:
  db:
    image: postgres:16
    container_name: doit-postgres
    environment:
      POSTGRES_USER: doit_user
      POSTGRES_PASSWORD: doit_password
      POSTGRES_DB: doit_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
